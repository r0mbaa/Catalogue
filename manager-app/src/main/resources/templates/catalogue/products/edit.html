<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>&ndash;Edit product [[${product.title}]]&ndash;</title>
  <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
<a data-th-href="@{/catalogue/products/list}"> Exit to list </a>
<a data-th-href="@{/catalogue/products/{productId}(productId=${product.id})}"> Cancel </a>
<h1>Edit product [[${product.title}]]</h1>
<form method="post" data-th-action="@{/catalogue/products/{productId}/edit(productId=${product.id})}">
  <label>Title

    <input type="text" name="title" data-th-value="${product.title}"><br>

  </label>
  <label>Details

    <input type="text" name="details" data-th-value="${product.details}"><br>
  </label>
  <label>Price
    <input type="text" name="price" data-th-value="${product.price}"><br>
  </label>
  <label>Quantity

    <input type="text" name="quantity" data-th-value="${product.quantity}"><br>
  </label>
  <button type="submit">Edit!</button>

</form>

</body>
</html>
